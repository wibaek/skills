# Optional UI dispatcher: 입력받은 exact tag를 실제 Production workflow의 ref로 dispatch한다.
# CLI에서 Production workflow를 exact tag ref로 직접 실행한다면 필요하지 않다.

name: HeadVer Production Request

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact HeadVer tag to deploy, for example v6.2635.147
        required: true
        type: string

permissions: {}

jobs:
  dispatch_production:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      deployments: read
    steps:
      - uses: actions/checkout@v6

      - name: Validate production selection
        env:
          TAG: ${{ inputs.tag }}
        run: ./scripts/assert-production-ready.sh "$TAG"

      - name: Dispatch exact tag to production
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh workflow run headver-production.yaml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$TAG" \
            -f requested_by="$GITHUB_ACTOR"
