name: Request Production Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact HeadVer tag to deploy, for example v6.2635.147
        required: true
        type: string

permissions: {}

jobs:
  dispatch_production:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch exact tag to production
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh workflow run deploy-production.yaml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$TAG"
