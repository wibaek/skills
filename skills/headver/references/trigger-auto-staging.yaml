name: Trigger Auto Staging

on:
  workflow_run:
    workflows:
      - Build Image
    types:
      - completed

permissions: {}

jobs:
  dispatch_staging:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Resolve exact tag
        id: tag
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          mapfile -t tags < <(
            git tag --points-at "$SOURCE_SHA" \
              | grep -E '^v[0-9]+\.[0-9]{4}\.[0-9]+$'
          )
          test "${#tags[@]}" -eq 1
          echo "tag=${tags[0]}" >> "$GITHUB_OUTPUT"

      - name: Dispatch exact tag to staging
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh workflow run deploy-staging.yaml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$TAG"
