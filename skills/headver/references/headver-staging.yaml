# Exact HeadVer tag의 기존 artifact를 staging에 배포한다. Source를 다시 build하지 않는다.
# 수동 실행: gh workflow run headver-staging.yaml --ref v6.2635.147

name: HeadVer Staging

on:
  workflow_dispatch:

concurrency:
  # 실행 중인 deploy는 완료하고, 대기 중인 이전 deploy는 최신 dispatch로 교체한다.
  group: headver-deploy-staging-${{ github.repository }}-my-app
  cancel-in-progress: false

permissions: {}

jobs:
  resolve_build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
    outputs:
      headver: ${{ steps.build_record.outputs.headver }}
      tag: ${{ steps.build_record.outputs.tag }}
      source_sha: ${{ steps.build_record.outputs.source_sha }}
      artifact_reference: ${{ steps.build_record.outputs.artifact_reference }}
      artifact_digest: ${{ steps.build_record.outputs.artifact_digest }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate exact HeadVer ref
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: ./scripts/assert-exact-headver-ref.sh "$REF_TYPE" "$TAG"

      - name: Resolve exact build
        id: build_record
        env:
          TAG: ${{ github.ref_name }}
        run: ./scripts/resolve-headver-build.sh "$TAG" "$GITHUB_OUTPUT"

      - name: Prevent stale staging overwrite
        env:
          TAG: ${{ steps.build_record.outputs.tag }}
          BUILD: ${{ steps.build_record.outputs.build }}
          ARTIFACT_DIGEST: ${{ steps.build_record.outputs.artifact_digest }}
        run: ./scripts/assert-staging-order.sh

  deploy_staging:
    needs: resolve_build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment: staging
    steps:
      - uses: actions/checkout@v6

      - name: Deploy existing artifact to staging
        env:
          ARTIFACT_REFERENCE: ${{ needs.resolve_build.outputs.artifact_reference }}
        run: ./scripts/deploy.sh staging "$ARTIFACT_REFERENCE"
